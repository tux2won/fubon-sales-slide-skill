name: Validate skill and examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run sync
      - run: npm run examples
      - run: git diff --exit-code -- web/styles-data.js examples
