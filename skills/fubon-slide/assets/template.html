<body><main id="deck" aria-label="{{TITLE}}">{{SLIDES}}</main>
<nav id="navigation" aria-label="Slide navigation"><button id="previous" aria-label="Previous slide">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Next slide">→</button><button id="open-index">Index / Esc</button><button id="static-toggle">Static / B</button><button id="print">Print</button></nav>
<dialog id="index"><header><h2>Slide index</h2><button id="index-close" aria-label="Close index">×</button></header><div class="index-grid"></div></dialog>
<script>
(()=>{const deck=document.querySelector('#deck'),pages=[...document.querySelectorAll('.slide')],prev=document.querySelector('#previous'),next=document.querySelector('#next'),counter=document.querySelector('#counter'),index=document.querySelector('#index');let current=0,start=null;
function resize(){const w=Number(getComputedStyle(document.documentElement).getPropertyValue('--w')),h=Number(getComputedStyle(document.documentElement).getPropertyValue('--h'));const scale=Math.min(innerWidth/w,(innerHeight-64)/h);deck.style.transform=`translate(-50%,-50%) scale(${scale})`;}
function show(i){current=Math.max(0,Math.min(pages.length-1,i));pages.forEach((p,j)=>{p.classList.toggle('active',j===current);p.setAttribute('aria-hidden',j===current?'false':'true');});prev.disabled=current===0;next.disabled=current===pages.length-1;counter.textContent=`${current+1} / ${pages.length}`;deck.dataset.current=String(current+1);}
function toggleStatic(){document.body.classList.toggle('static');document.querySelector('#static-toggle').setAttribute('aria-pressed',String(document.body.classList.contains('static')));}
pages.forEach((p,i)=>{const b=document.createElement('button');b.className='index-card';b.type='button';const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');b.append(n,document.createTextNode(p.querySelector('h1,h2')?.textContent||`Slide ${i+1}`));b.addEventListener('click',()=>{show(i);index.close();});index.querySelector('.index-grid').append(b);});
prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.querySelector('#open-index').onclick=()=>index.showModal();document.querySelector('#index-close').onclick=()=>index.close();document.querySelector('#static-toggle').onclick=toggleStatic;document.querySelector('#print').onclick=()=>print();
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='Escape'){if(index.open)index.close();else index.showModal();e.preventDefault();return;}if(index.open)return;if(['ArrowRight','PageDown',' '].includes(e.key)){show(current+1);e.preventDefault();}if(['ArrowLeft','PageUp'].includes(e.key)){show(current-1);e.preventDefault();}if(e.key.toLowerCase()==='b')toggleStatic();if(e.key==='Home')show(0);if(e.key==='End')show(pages.length-1);});
deck.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};});deck.addEventListener('pointerup',e=>{if(start&&Math.abs(e.clientX-start.x)>55&&Math.abs(e.clientX-start.x)>Math.abs(e.clientY-start.y)*1.3)show(current+(e.clientX<start.x?1:-1));start=null;});addEventListener('resize',resize);show(0);resize();})();
</script></body></html>
